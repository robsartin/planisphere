#
# Dependabot config. Prior to this file the repository ran on Dependabot's
# default behaviour. This file makes the schedule explicit and keeps the
# grouping we've been using.

version: 2

updates:
  # npm dependencies (both prod and dev) — grouped into one PR per week so
  # security and version bumps land together and only need one CI cycle.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Once we've pushed a fix commit (e.g. to hold back a bump that breaks
    # peer deps — see #371 / #392 / #395 pinning TypeScript at 6.0.3),
    # Dependabot's default rebase-on-force-push behavior force-rebases our
    # commit onto latest main and then closes the PR when the resulting
    # tree no longer matches its expected update-group fingerprint. Disabling
    # rebase keeps our branches intact so we can push fixes without losing
    # the PR. (#396)
    rebase-strategy: "disabled"
    # TypeScript majors are held back until typescript-eslint supports them.
    # typescript-eslint hard-errors on an unsupported TS major ("typescript-eslint
    # does not support TS 7.0"), so a TS major bump fails `pnpm lint` outright —
    # it is not a code problem we can fix on our side. We had pinned TS back to
    # 6.0.3 by hand four times (#371, #392, #395, #408) before adding this.
    # Patch and minor updates inside the current major still come through.
    # Remove this once https://github.com/typescript-eslint/typescript-eslint/issues/10940
    # lands, then bump TypeScript deliberately in its own PR.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      npm_and_yarn:
        patterns:
          - "*"

  # GitHub Actions used by the workflows in .github/workflows/. Pinning them
  # to tagged versions and letting Dependabot open PRs for each new release
  # keeps supply-chain risk down without turning into manual work.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    rebase-strategy: "disabled"
